services:
  - type: web
    name: api-tasa-titanes
    env: python
    plan: free
    
    # --- ¡LÍNEA MODIFICADA! ---
    # 1. Da permisos de ejecución
    # 2. Y LUEGO ejecuta el script
    buildCommand: "chmod +x ./render_build.sh && ./render_build.sh"

    # El Start Command sigue igual
    startCommand: |
      export PATH="${PATH}:/opt/render/project/.render/chrome/opt/google/chrome"; gunicorn api:app

